map $http_user_agent $vm_is_bot {
    default 0;
    ~*(facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|telegrambot|discordbot|googlebot|google-inspectiontool|bingbot) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location ^~ /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
    location = /sitemap.xml { proxy_pass http://backend:8010/api/sitemap.xml; }
    location = /robots.txt { proxy_pass http://backend:8010/api/robots.txt; }
    # Bots must receive actual JS/CSS/images, never a generic HTML SEO document.
    location ~* \.(?:css|js|mjs|map|svg|png|jpe?g|webp|gif|ico|woff2?|ttf|pdf|txt|xml)$ {
        try_files $uri =404;
    }
    location ~ ^/product/([^/]+)/?$ {
        return 301 /products/$1;
    }
    location / {
        error_page 418 = @crawler;
        if ($vm_is_bot) { return 418; }
        try_files $uri /index.html;
    }
    location @crawler {
        rewrite ^ /api/seo/render?path=$request_uri break;
        proxy_pass http://backend:8010;
    }
}
