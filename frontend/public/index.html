<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/corporate/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#df2030" />
        <meta name="description" content="VETMECH Pharmaceuticals — The Science of Animal Health. Explore our company, veterinary product portfolio and professional partnerships." />
        <meta name="robots" content="index, follow" />
        <meta property="og:site_name" content="VETMECH PHARMACEUTICALS PRIVATE LIMITED" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="VETMECH Pharmaceuticals | Veterinary Medicines India" />
        <meta property="og:description" content="Premium veterinary pharmaceuticals for large animals, small animals and poultry." />
        <meta name="twitter:card" content="summary_large_image" />
        <!-- Each route sets its own canonical. A homepage canonical here would
             incorrectly compete with every product and article URL. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "VETMECH PHARMACEUTICALS PRIVATE LIMITED",
          "url": "https://vetmechpharma.in",
          "logo": "https://vetmechpharma.in/corporate/brand.svg"
        }
        </script>
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "VETMECH PHARMACEUTICALS PRIVATE LIMITED",
          "url": "https://vetmechpharma.in",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://vetmechpharma.in/products?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
        </script>
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>VETMECH | The Science of Animal Health</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

    </body>
</html>
