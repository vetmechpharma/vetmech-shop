services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - database:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-VETMECH_SHOP}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init_config.py first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_ENV: production
      SEED_DEMO_DATA: "false"
      ALLOW_DEV_OTP: "false"
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      APP_BASE_URL: ${SITE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      WEBHOOK_CRON_SECRET: ${WEBHOOK_CRON_SECRET:?Run scripts/init_config.py first}
    volumes:
      - uploads:/app/uploads
      - ./backups:/backups
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  database:
  uploads:
